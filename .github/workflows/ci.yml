name: CI

on:
  pull_request:
    branches: [developer, main]
  push:
    branches: [developer, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
      # dependabot solo toca requirements.txt: si el lock no lo sigue, el CI estaría probando versiones viejas.
      # - Parte del lock actual: uv conserva los pins de las transitivas y solo cambia lo que pide
      #   requirements.txt (si no, cualquier release nueva de una transitiva pondría el CI en rojo).
      # - Compara solo las líneas `paquete==versión`: ni los hashes (PyPI puede añadir wheels a una
      #   versión ya publicada) ni el formato de uv cambian el resultado.
      # - Va primero: sin compilar Rust ni instalar nada, falla en segundos.
      - name: Lock de Python al día con requirements.txt
        run: |
          nuevo="$RUNNER_TEMP/requirements.lock"
          cp pipeline/requirements.lock "$nuevo"
          uv pip compile pipeline/requirements.txt --python-version 3.12 --python-platform linux \
            --generate-hashes --quiet -o "$nuevo"
          pins() { grep -E '^[^ #]' "$1"; }
          diff -u <(pins pipeline/requirements.lock) <(pins "$nuevo") \
            || { echo "::error file=pipeline/requirements.lock::Desactualizado. Regenera con el comando de su cabecera."; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - run: pip install --require-hashes -r pipeline/requirements.lock  # para tests/test_tendencias.py
      - run: bash tests/e2e.sh
