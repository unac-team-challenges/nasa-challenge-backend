name: Actualizar datos

on:
  schedule:
    - cron: "0 6 1 * *" # día 1 de cada mes, 06:00 UTC
  workflow_dispatch: # también manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: developer # por ahora developer; cambiar a main cuando se decida (el cron solo corre si este archivo está en main)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      # Si el pipeline pasa a earthaccess, añadir aquí env con
      # EARTHDATA_USERNAME / EARTHDATA_PASSWORD desde secrets.
      - run: python pipeline/power.py 2015 "$(date +%Y)"
      - name: Commit si cambió
        run: |
          git diff --quiet data/power.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/power.json
          git commit -m "chore: actualizar data/power.json"
          git push
