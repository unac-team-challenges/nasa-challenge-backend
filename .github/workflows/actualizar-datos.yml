name: Actualizar datos

on:
  schedule:
    - cron: "0 6 1 * *" # día 1 de cada mes, 06:00 UTC
  workflow_dispatch: # también manual desde la pestaña Actions

permissions:
  contents: write
  pull-requests: write

concurrency: actualizar-datos

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: developer # por ahora developer; cambiar a main cuando se decida (el cron solo corre si este archivo está en main)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - run: pip install --require-hashes -r pipeline/requirements.lock
      - run: python pipeline/power.py 2001 "$(date +%Y)"
      - run: python -W ignore pipeline/gpm.py 2001 "$(date +%Y)"
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      - run: python pipeline/tendencias.py
      # Un push con GITHUB_TOKEN no dispara el CI: el e2e corre aquí, antes de proponer nada.
      - uses: Swatinem/rust-cache@v2
      - run: bash tests/e2e.sh # si falla, no se abre PR
      - name: Abrir PR si cambió
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -z "$(git status --porcelain data/)" ] && exit 0  # también archivos nuevos
          hoy="$(date +%F)"  # una vez: rama y título coinciden aunque el job cruce medianoche
          rama="datos/actualizacion-$hoy"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$rama"
          git add data/
          git commit -m "chore: actualizar datos (POWER, GPM y tendencias)"
          # Sin --force: si la rama ya existe (otra ejecución hoy), git rechaza el push y no pisa nada.
          git push origin "$rama" || {
            echo "::error::No se pudo subir $rama (error de git arriba). Si ya existe por otra ejecución de hoy: mezcla o cierra su PR si lo tiene, borra la rama y relanza."
            exit 1
          }
          # Sin `|| echo`: si gh falla (permisos, red...), el job queda en rojo con el error real.
          gh pr create --base developer --head "$rama" \
            --title "chore: actualizar datos ($hoy)" \
            --body "Datos regenerados por el cron (POWER, GPM y tendencias). El \`e2e\` pasó en el job antes de abrir este PR, pero un PR del bot no dispara el CI: revisa el diff de \`data/\` antes de mezclar."
