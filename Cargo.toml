[package]
name = "nasa-challenge-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "set-header"] }
serde = { version = "1", features = ["derive"] }
utoipa = "6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
